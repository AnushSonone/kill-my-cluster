# Oracle / hosted overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.oracle.yml up -d --build
#
# Public: control plane :8080, Grafana :3001
# Private: Prometheus (no host port)
# UI: anush.wiki/blog/raft (local Svelte web service disabled)

services:
  web:
    profiles: ["local-ui"]

  # Re-balanced 2026-07-28 for the post-incident CPU caps (nodes 0.45 each):
  # 128 read workers saturated the capped leader and starved the write path
  # to ~25w/s (write p50 hit 2.5s+ with zero errors). Measured with this mix:
  # ~640w/s + ~850r/s sustained, term flat, no errors. The old uncapped
  # ladder peak (~1413w/3233r, 2026-07-21) is not reachable under caps;
  # re-ladder if the headline number matters.
  loadgen:
    environment:
      WRITE_QPS: "1400"
      READ_QPS: "2000"
      WRITE_WORKERS: "64"
      READ_WORKERS: "32"

  prometheus:
    ports: !override []

  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://raft-grafana.anush.wiki
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: disabled
      GF_SECURITY_X_FRAME_OPTIONS: ""
