# Oracle / hosted overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.oracle.yml up -d --build
#
# Public: control plane :8080, Grafana :3001
# Private: Prometheus (no host port)
# UI: anush.wiki/blog/raft (local Svelte web service disabled)
#
# Tuned 2026-08-10 for Always Free A1 Flex 2 OCPU / 12 GB (was 4/24).
# Soft-cap sum ~1.75 so sshd/cloudflared/steal keep ~0.25. Local Mac keeps
# the higher base caps in docker-compose.yml.

services:
  web:
    profiles: ["local-ui"]

  # Nodes: 7 x 0.18 = 1.26. GOMAXPROCS 1 matches the tighter CPU share.
  node1:
    cpus: 0.18
    environment:
      GOMAXPROCS: "1"
  node2:
    cpus: 0.18
    environment:
      GOMAXPROCS: "1"
  node3:
    cpus: 0.18
    environment:
      GOMAXPROCS: "1"
  node4:
    cpus: 0.18
    environment:
      GOMAXPROCS: "1"
  node5:
    cpus: 0.18
    environment:
      GOMAXPROCS: "1"
  node6:
    cpus: 0.18
    environment:
      GOMAXPROCS: "1"
  node7:
    cpus: 0.18
    environment:
      GOMAXPROCS: "1"

  # Re-laddered 2026-08-10 on Always Free 2 OCPU / 12 GB. Peak sustained under
  # term-flat + zero commit-stall: ~787w/876r at 900/1400 with 48w/24r. Higher
  # targets (1000/1600) thrashed the capped loadgen and cut delivered QPS.
  loadgen:
    cpus: 0.20
    environment:
      WRITE_QPS: "900"
      READ_QPS: "1400"
      WRITE_WORKERS: "48"
      READ_WORKERS: "24"

  # Chaos monkey on: the public demo shows a kill and recovery about once a
  # minute even with nobody clicking. One node at a time, never during an
  # outage, never within 30s of a visitor kill.
  controlplane:
    cpus: 0.08
    environment:
      CHAOS_INTERVAL: 60s

  prometheus:
    cpus: 0.08
    ports: !override []

  grafana:
    cpus: 0.08
    environment:
      GF_SERVER_ROOT_URL: https://raft-grafana.anush.wiki
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: disabled
      GF_SECURITY_X_FRAME_OPTIONS: ""

  node-exporter:
    cpus: 0.05
