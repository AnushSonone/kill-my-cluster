# 7-node local demo cluster + Prometheus + Grafana + control plane.
# Kill UI:   http://localhost:8080
# Grafana:   http://localhost:3001  (admin/admin) — not :3000 (wiki owns that locally)
# Prom:      http://localhost:9090
# Graph UI:  http://localhost:5173  (Threlte/Three.js client-side; SVG fallback)
# Loadgen:   ~1.5K writes/s + ~10K reads/s (see loadgen service)
#
# Auto-heal: control plane restarts/rejoins machines ~10s after kill/partition.
#
# Oracle Always Free (Ampere A1 ~2 OCPU / 12 GB): 3D mesh is browser-only — do not
# add server-side WebGL. Budget RAM for this compose stack (~1–2 GB typical on Mac):
#   node1–7 ~100MB each, grafana ~250MB, prometheus ~100MB, CP+web ~40MB.
# If the VM is tight: lower Grafana retention, avoid extra sidecars, prefer arm64
# images — do not drop the client 3D bundle.

name: kmc

# Container logs are capped so a long demo run cannot fill the VM root disk.
# Default json-file logging is unbounded: at ~4.4k ops/s the 2026-07-21/22
# Oracle box wedged with sshd unable to write (TCP open, no banner).
# Ceiling here is 30MB per container, ~390MB across the stack.
x-logging: &kmc-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  node1:
    build: ../..
    container_name: kmc-node-1
    cpus: 0.45
    logging: *kmc-logging
    environment:
      NODE_ID: "1"
      # Match the CPU cap: fewer runnable threads, less scheduler thrash.
      GOMAXPROCS: "2"
      DATA_DIR: /data
      RAFT_ADDR: 0.0.0.0:7000
      KV_ADDR: 0.0.0.0:8000
      METRICS_ADDR: 0.0.0.0:9100
      PEERS: 2=node2:7000,3=node3:7000,4=node4:7000,5=node5:7000,6=node6:7000,7=node7:7000
      KV_PEERS: 1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000,7=node7:8000
      # Heartbeat off when loadgen is running (compose loadgen service).
      RUN_AGENT: "false"
    volumes:
      - node1-data:/data
    networks: [kmc]
    restart: unless-stopped

  node2:
    build: ../..
    container_name: kmc-node-2
    cpus: 0.45
    logging: *kmc-logging
    environment:
      NODE_ID: "2"
      # Match the CPU cap: fewer runnable threads, less scheduler thrash.
      GOMAXPROCS: "2"
      DATA_DIR: /data
      RAFT_ADDR: 0.0.0.0:7000
      KV_ADDR: 0.0.0.0:8000
      METRICS_ADDR: 0.0.0.0:9100
      PEERS: 1=node1:7000,3=node3:7000,4=node4:7000,5=node5:7000,6=node6:7000,7=node7:7000
      KV_PEERS: 1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000,7=node7:8000
      RUN_AGENT: "false"
    volumes:
      - node2-data:/data
    networks: [kmc]
    restart: unless-stopped

  node3:
    build: ../..
    container_name: kmc-node-3
    cpus: 0.45
    logging: *kmc-logging
    environment:
      NODE_ID: "3"
      # Match the CPU cap: fewer runnable threads, less scheduler thrash.
      GOMAXPROCS: "2"
      DATA_DIR: /data
      RAFT_ADDR: 0.0.0.0:7000
      KV_ADDR: 0.0.0.0:8000
      METRICS_ADDR: 0.0.0.0:9100
      PEERS: 1=node1:7000,2=node2:7000,4=node4:7000,5=node5:7000,6=node6:7000,7=node7:7000
      KV_PEERS: 1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000,7=node7:8000
      RUN_AGENT: "false"
    volumes:
      - node3-data:/data
    networks: [kmc]
    restart: unless-stopped

  node4:
    build: ../..
    container_name: kmc-node-4
    cpus: 0.45
    logging: *kmc-logging
    environment:
      NODE_ID: "4"
      # Match the CPU cap: fewer runnable threads, less scheduler thrash.
      GOMAXPROCS: "2"
      DATA_DIR: /data
      RAFT_ADDR: 0.0.0.0:7000
      KV_ADDR: 0.0.0.0:8000
      METRICS_ADDR: 0.0.0.0:9100
      PEERS: 1=node1:7000,2=node2:7000,3=node3:7000,5=node5:7000,6=node6:7000,7=node7:7000
      KV_PEERS: 1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000,7=node7:8000
      RUN_AGENT: "false"
    volumes:
      - node4-data:/data
    networks: [kmc]
    restart: unless-stopped

  node5:
    build: ../..
    container_name: kmc-node-5
    cpus: 0.45
    logging: *kmc-logging
    environment:
      NODE_ID: "5"
      # Match the CPU cap: fewer runnable threads, less scheduler thrash.
      GOMAXPROCS: "2"
      DATA_DIR: /data
      RAFT_ADDR: 0.0.0.0:7000
      KV_ADDR: 0.0.0.0:8000
      METRICS_ADDR: 0.0.0.0:9100
      PEERS: 1=node1:7000,2=node2:7000,3=node3:7000,4=node4:7000,6=node6:7000,7=node7:7000
      KV_PEERS: 1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000,7=node7:8000
      RUN_AGENT: "false"
    volumes:
      - node5-data:/data
    networks: [kmc]
    restart: unless-stopped

  node6:
    build: ../..
    container_name: kmc-node-6
    cpus: 0.45
    logging: *kmc-logging
    environment:
      NODE_ID: "6"
      # Match the CPU cap: fewer runnable threads, less scheduler thrash.
      GOMAXPROCS: "2"
      DATA_DIR: /data
      RAFT_ADDR: 0.0.0.0:7000
      KV_ADDR: 0.0.0.0:8000
      METRICS_ADDR: 0.0.0.0:9100
      PEERS: 1=node1:7000,2=node2:7000,3=node3:7000,4=node4:7000,5=node5:7000,7=node7:7000
      KV_PEERS: 1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000,7=node7:8000
      RUN_AGENT: "false"
    volumes:
      - node6-data:/data
    networks: [kmc]
    restart: unless-stopped

  node7:
    build: ../..
    container_name: kmc-node-7
    cpus: 0.45
    logging: *kmc-logging
    environment:
      NODE_ID: "7"
      # Match the CPU cap: fewer runnable threads, less scheduler thrash.
      GOMAXPROCS: "2"
      DATA_DIR: /data
      RAFT_ADDR: 0.0.0.0:7000
      KV_ADDR: 0.0.0.0:8000
      METRICS_ADDR: 0.0.0.0:9100
      PEERS: 1=node1:7000,2=node2:7000,3=node3:7000,4=node4:7000,5=node5:7000,6=node6:7000
      KV_PEERS: 1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000,7=node7:8000
      RUN_AGENT: "false"
    volumes:
      - node7-data:/data
    networks: [kmc]
    restart: unless-stopped

  loadgen:
    build:
      context: ../..
      dockerfile: Dockerfile.loadgen
    container_name: kmc-loadgen
    cpus: 0.3
    logging: *kmc-logging
    environment:
      KV_PEERS: 1=node1:8000,2=node2:8000,3=node3:8000,4=node4:8000,5=node5:8000,6=node6:8000,7=node7:8000
      # Aligned to Oracle ladder ceiling (2026-07-21): ~1400w/3000r sustained
      # on A1 Flex 4 OCPU with term flat. Local may exceed; cloud is the claim.
      WRITE_QPS: "1400"
      READ_QPS: "3000"
      WRITE_WORKERS: "64"
      READ_WORKERS: "128"
    depends_on: [node1, node2, node3, node4, node5, node6, node7]
    networks: [kmc]
    restart: unless-stopped

  controlplane:
    build:
      context: ../..
      dockerfile: Dockerfile.controlplane
    container_name: kmc-controlplane
    cpus: 0.3
    logging: *kmc-logging
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      CONTROL_NODES: 1=kmc-node-1,2=kmc-node-2,3=kmc-node-3,4=kmc-node-4,5=kmc-node-5,6=kmc-node-6,7=kmc-node-7
      CONTROL_NETWORK: kmc_kmc
      HEAL_AFTER: 10s
      PROMETHEUS_URL: http://prometheus:9090
      ALLOW_RESET: "false"
      CORS_ORIGINS: https://anush.wiki,http://127.0.0.1:3000,http://localhost:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks: [kmc]
    restart: unless-stopped
    depends_on: [node1, node2, node3, node4, node5, node6, node7, prometheus]
  web:
    build: ../../web
    container_name: kmc-web
    cpus: 0.5
    logging: *kmc-logging
    environment:
      HOST: 0.0.0.0
      PORT: "5173"
      CONTROLPLANE_URL: http://controlplane:8080
    ports:
      - "5173:5173"
    depends_on: [controlplane]
    networks: [kmc]
    restart: unless-stopped

  # Host (VM) CPU/memory for HUD + Grafana. Scrapes the Linux VM under Docker
  # (Oracle host, or Docker Desktop's Linux VM locally). No public port.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: kmc-node-exporter
    cpus: 0.1
    logging: *kmc-logging
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/rootfs
      - --web.listen-address=:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
    networks: [kmc]
    restart: unless-stopped
    pid: host

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: kmc-prometheus
    cpus: 0.3
    logging: *kmc-logging
    # scrape_interval is 1s (see prometheus.yml) to keep the wiki HUD live, so the
    # TSDB grows ~15x faster than a default 15s scrape. Without these flags
    # Prometheus keeps 15 days with no size cap, which is what filled the Oracle
    # root disk. retention.size is the hard backstop: whichever limit hits first wins.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=2GB
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"
    networks: [kmc]
    restart: unless-stopped
    depends_on: [node-exporter]

  grafana:
    image: grafana/grafana:11.5.2
    container_name: kmc-grafana
    cpus: 0.3
    logging: *kmc-logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Allow embedding from wiki / local UI (host Grafana on :3001).
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: disabled
      GF_SECURITY_X_FRAME_OPTIONS: ""
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [kmc]
    restart: unless-stopped

networks:
  kmc:
    driver: bridge
    name: kmc_kmc

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
  node6-data:
  node7-data:
  # Named so the TSDB survives container recreate and can be inspected or pruned
  # directly. Bounding disk is done by the retention flags, not by this volume.
  prom-data:
